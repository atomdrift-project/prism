<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    {{template "favicon"}}
    <title>{{.Title}} - {{if isPublic}}OpenHash{{else}}litmus{{end}}</title>
    <style nonce="{{.StyleNonce}}">
        {{template "fonts" .}}
        {{template "sitestyle" .}}
        .lede a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
        .detail { align-self: flex-start; padding: 6px 12px; border-radius: 6px; background: var(--mist); font-family: var(--mono); font-size: 13px; color: var(--ink-mid); overflow-wrap: anywhere; }
    </style>
</head>
<body>
    {{template "banner" .}}
    {{template "topbar" .Chrome}}
    <main class="page" id="main">
        <div class="page-head">
            <div>
                <h1>{{.Title}}</h1>
                <p class="lede">{{if .MessageHTML}}{{.MessageHTML}}{{else}}{{.Message}}{{end}}</p>
            </div>
        </div>
        {{if .Detail}}<code class="detail">{{.Detail}}</code>{{end}}
    </main>
    {{template "footer" .}}
</body>
</html>
